<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LinguaFlow — Aprenda Inglês de Verdade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080f;--bg2:#0e0e1a;--sf:rgba(255,255,255,.035);--sf2:rgba(255,255,255,.065);--sf3:rgba(255,255,255,.1);--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);--tx:#e8eaf0;--tx2:#c1c5d0;--mt:#5a6078;--ac:#7c6aed;--ac2:#6352d4;--acg:rgba(124,106,237,.15);--pos:#2dd4a0;--posbg:rgba(45,212,160,.08);--warn:#f5b638;--warnbg:rgba(245,182,56,.08);--err:#ef6461;--errbg:rgba(239,100,97,.08);--xp:#f5b638;--streak:#ef6461;--track:rgba(255,255,255,.04);--ubbl:linear-gradient(135deg,#6352d4,#7c6aed);--abbl:rgba(255,255,255,.05);--r:14px;--rs:10px;--rx:8px}
[data-theme="light"]{--bg:#f5f4f8;--bg2:#eeedf3;--sf:rgba(0,0,0,.03);--sf2:rgba(0,0,0,.06);--sf3:rgba(0,0,0,.09);--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.12);--tx:#1a1a2e;--tx2:#3a3a5c;--mt:#8888a8;--ac:#6352d4;--ac2:#5242b8;--acg:rgba(99,82,212,.1);--pos:#16a878;--posbg:rgba(22,168,120,.08);--warn:#d49a12;--warnbg:rgba(212,154,18,.08);--err:#d44040;--errbg:rgba(212,64,64,.08);--track:rgba(0,0,0,.04);--ubbl:linear-gradient(135deg,#6352d4,#7c6aed);--abbl:rgba(0,0,0,.04)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body.no-scroll{overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:10px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes xpPop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes streakFire{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes typing{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.ani{animation:fadeIn .35s ease-out}
 
/* Components */
.btn{padding:10px 18px;border:none;border-radius:var(--rs);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff}.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn-g:hover{background:var(--sf2)}
.btn-s{padding:6px 12px;font-size:11px;border-radius:var(--rx)}
.btn-i{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--rx);background:var(--sf);border:1px solid var(--bd);cursor:pointer;color:var(--tx);font-size:16px;transition:all .2s}.btn-i:hover{background:var(--sf2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:600}
.badge-xp{background:rgba(245,182,56,.12);color:var(--xp)}.badge-streak{background:rgba(239,100,97,.12);color:var(--streak)}
.input{padding:10px 14px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;width:100%}.input:focus{border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.prog-track{background:var(--track);border-radius:99px;overflow:hidden;height:6px}.prog-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
 
/* Setup */
.setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.setup::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(124,106,237,.06),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(45,212,160,.04),transparent 50%);pointer-events:none}
.setup-box{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:36px 28px;max-width:440px;width:100%;position:relative;backdrop-filter:blur(20px)}
.setup-box h1{font-family:'Fraunces',serif;font-size:26px;text-align:center;color:var(--tx)}.brand{color:var(--ac);font-style:italic}
.setup-box .sub{text-align:center;color:var(--mt);font-size:13px;margin-bottom:24px}
.setup-box label{font-size:11px;color:var(--mt);display:block;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.hint{font-size:11px;color:var(--mt);margin-top:8px;line-height:1.6}.hint a{color:var(--ac);text-decoration:none}
.err-msg{color:var(--err);font-size:11px;margin-top:6px}
 
/* Dashboard */
.dash{min-height:100vh;background:var(--bg);padding:20px 20px 80px;overflow-y:auto}
.dash::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(124,106,237,.05),transparent 60%);pointer-events:none;z-index:0}
.dash-c{max-width:820px;margin:0 auto;position:relative;z-index:1}
.dash-greeting{font-family:'Fraunces',serif;font-size:28px;font-weight:700;text-align:center;margin-bottom:6px}
.dash-sub{text-align:center;color:var(--mt);font-size:13px;margin-bottom:20px}
.streak-banner{background:linear-gradient(135deg,rgba(239,100,97,.1),rgba(245,182,56,.1));border:1px solid rgba(239,100,97,.15);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:20px}
.streak-fire{font-size:36px;animation:streakFire 1.5s ease-in-out infinite}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.d-stat{text-align:center;padding:16px 8px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd)}
.d-stat .icon{font-size:22px;margin-bottom:4px}.d-stat .val{font-size:22px;font-weight:700}.d-stat .lbl{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
 
/* Mode Cards */
.mode-cards{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px}
.mode-card{padding:24px 20px;border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.mode-card:hover{transform:translateY(-3px);border-color:var(--bd2)}
.mode-card .mc-badge{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:99px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.mode-card .mc-icon{font-size:36px;margin-bottom:10px}
.mode-card .mc-title{font-size:18px;font-weight:700;margin-bottom:4px}
.mode-card .mc-desc{font-size:12px;color:var(--mt);line-height:1.5}
.mode-card .mc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mode-card .mc-tag{padding:3px 8px;border-radius:99px;font-size:9px;background:var(--sf2);color:var(--tx2)}
.mc-teacher{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(124,106,237,.05))}.mc-teacher:hover{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(124,106,237,.1))}
.mc-friends{background:linear-gradient(135deg,rgba(239,100,97,.08),rgba(245,182,56,.05))}.mc-friends:hover{background:linear-gradient(135deg,rgba(239,100,97,.15),rgba(245,182,56,.1))}
.mc-free{background:linear-gradient(135deg,rgba(45,212,160,.08),rgba(124,106,237,.05))}.mc-free:hover{background:linear-gradient(135deg,rgba(45,212,160,.15),rgba(124,106,237,.1))}
 
/* Chat */
.app{display:flex;height:100vh;width:100%}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.c-header{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sf);flex-shrink:0}
.h-left{display:flex;align-items:center;gap:10px}
.h-info .h-title{font-weight:600;font-size:14px}.h-info .h-sub{font-size:10px;color:var(--mt);display:flex;align-items:center;gap:5px}
.h-right{display:flex;align-items:center;gap:6px}
.scenario-sel{padding:5px 8px;border-radius:var(--rx);border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:11px;font-family:inherit;cursor:pointer;outline:none}
 
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;animation:fadeIn .3s ease-out;align-items:flex-end;gap:8px}.msg-row.user{justify-content:flex-end}.msg-row.bot{justify-content:flex-start}
.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--sf2);border:1px solid var(--bd)}
.msg-col{max-width:78%;display:flex;flex-direction:column;gap:2px}
.msg-name{font-size:9px;font-weight:600;color:var(--mt);padding-left:4px;text-transform:uppercase;letter-spacing:.5px}
.msg-bbl{padding:10px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg-row.user .msg-bbl{background:var(--ubbl);color:#fff;border-radius:18px 18px 4px 18px}
.msg-row.bot .msg-bbl{background:var(--abbl);border-radius:18px 18px 18px 4px}
.msg-acts{display:flex;gap:4px;margin-top:2px;padding-left:4px}
.tts-btn{background:none;border:none;cursor:pointer;font-size:12px;opacity:.4;transition:opacity .2s;padding:2px}.tts-btn:hover{opacity:1}.tts-btn.playing{opacity:1;animation:pulse 1s infinite}
.word-cl{cursor:pointer;border-bottom:1px dashed transparent;transition:all .15s}.word-cl:hover{border-bottom-color:var(--ac);background:var(--acg)}
 
/* Friend-specific bubble colors */
.bbl-jake{background:linear-gradient(135deg,rgba(239,100,97,.12),rgba(239,100,97,.05))!important;border:1px solid rgba(239,100,97,.1)}
.bbl-mia{background:linear-gradient(135deg,rgba(236,72,153,.12),rgba(236,72,153,.05))!important;border:1px solid rgba(236,72,153,.1)}
.bbl-tyler{background:linear-gradient(135deg,rgba(45,212,160,.12),rgba(45,212,160,.05))!important;border:1px solid rgba(45,212,160,.1)}
.bbl-teacher{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(59,130,246,.04))!important;border:1px solid rgba(59,130,246,.08)}
 
/* Whiteboard */
.whiteboard{margin:8px 0;padding:14px 16px;border-radius:var(--r);background:rgba(255,255,255,.03);border:1px dashed var(--bd2);font-size:12px;line-height:1.8}
[data-theme="light"] .whiteboard{background:rgba(0,0,0,.02)}
.wb-title{font-size:10px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.wb-example{padding:6px 10px;border-radius:var(--rx);background:var(--sf2);margin:4px 0;font-family:'Courier New',monospace}
.wb-formal{color:var(--warn)}.wb-real{color:var(--pos)}
.wb-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:6px 0}
.wb-vs-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:center}
 
/* Cultural note */
.culture-note{margin:6px 0;padding:10px 12px;border-radius:var(--rs);background:rgba(245,182,56,.06);border-left:3px solid var(--warn);font-size:11px;line-height:1.6}
.culture-note .cn-title{font-size:9px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
 
.typing-ind{padding:10px 18px;border-radius:18px 18px 18px 4px;background:var(--abbl);display:inline-flex;gap:4px;align-items:center}
.t-dot{width:6px;height:6px;border-radius:50%;background:var(--ac)}.t-dot:nth-child(1){animation:bounce 1.2s ease-in-out 0s infinite}.t-dot:nth-child(2){animation:bounce 1.2s ease-in-out .15s infinite}.t-dot:nth-child(3){animation:bounce 1.2s ease-in-out .3s infinite}
 
.xp-popup{position:fixed;top:20%;left:50%;transform:translateX(-50%);z-index:999;animation:xpPop .5s ease-out;pointer-events:none}
.xp-inner{background:linear-gradient(135deg,rgba(245,182,56,.2),rgba(245,182,56,.05));border:1px solid rgba(245,182,56,.3);border-radius:var(--r);padding:12px 24px;text-align:center;backdrop-filter:blur(12px)}
.xp-amount{font-size:28px;font-weight:800;color:var(--xp)}.xp-label{font-size:11px;color:var(--mt)}
.trans-bar{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:50;background:var(--tx);color:var(--bg);padding:6px 16px;border-radius:8px;font-size:13px;animation:fadeIn .2s}
 
.input-area{padding:10px 16px;border-top:1px solid var(--bd);background:var(--sf)}
.input-wrap{display:flex;gap:6px;align-items:center;background:var(--bg);border-radius:var(--r);padding:4px 4px 4px 14px;border:1px solid var(--bd);transition:border-color .2s}.input-wrap:focus-within{border-color:rgba(124,106,237,.4)}
.input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:13px;padding:8px 0;font-family:inherit}
.send-btn{background:var(--ac);border:none;border-radius:var(--rs);padding:8px 16px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}.send-btn:disabled{background:var(--sf2);opacity:.4;cursor:default}
 
/* Side Panel */
.side{width:340px;border-left:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg2);flex-shrink:0;overflow:hidden}
.side .tab-bar{display:flex;border-bottom:1px solid var(--bd);background:var(--sf)}.tab{flex:1;padding:10px 4px;border:none;background:none;cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;border-bottom:2px solid transparent;color:var(--mt);transition:all .2s}.tab.active{border-bottom-color:var(--ac);color:var(--tx)}
.side-c{flex:1;overflow-y:auto;padding:14px}
 
/* Feedback */
.fb{padding:10px 12px;border-radius:var(--rs);margin-bottom:6px;animation:fadeIn .3s;border-left:3px solid}
.fb.positive{background:var(--posbg);border-left-color:var(--pos)}.fb.correction{background:var(--warnbg);border-left-color:var(--warn)}.fb.culture{background:rgba(59,130,246,.06);border-left-color:#3b82f6}
.fb-text{font-size:12px;font-weight:500}.fb-detail{font-size:11px;color:var(--mt);line-height:1.5;margin-top:3px}.fb-rule{margin-top:4px;padding:6px 8px;border-radius:var(--rx);background:var(--sf);font-size:10px;color:var(--tx2);line-height:1.5}
 
/* Slang dictionary */
.slang-item{padding:10px 12px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;animation:fadeIn .3s}
.slang-word{font-size:14px;font-weight:700;color:var(--ac)}.slang-pron{font-size:10px;color:var(--mt);font-style:italic}
.slang-def{font-size:12px;margin-top:2px;color:var(--tx2)}.slang-ex{font-size:11px;color:var(--mt);margin-top:3px;font-style:italic;padding-left:8px;border-left:2px solid var(--bd)}
.slang-formal{font-size:10px;color:var(--warn);margin-top:3px}
 
/* Goals etc */
.goal-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}
.goal-chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--bd);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;flex-shrink:0;transition:all .2s}.goal-chk.done{background:var(--pos);border-color:var(--pos)}
.goal-txt{flex:1;font-size:12px}.goal-txt.done{text-decoration:line-through;opacity:.4}
.goal-rm{background:none;border:none;color:var(--mt);cursor:pointer;font-size:13px;padding:2px;opacity:.4}.goal-rm:hover{opacity:1}
.empty{text-align:center;padding:30px 16px;color:var(--mt)}.empty .icon{font-size:28px;margin-bottom:8px}.empty p{font-size:12px;line-height:1.6}
 
/* Lesson selector */
.lesson-card{padding:12px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.lesson-card:hover{background:var(--sf2);border-color:var(--bd2)}
.lesson-num{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.lesson-num.completed{background:var(--pos)}
.lesson-info .l-title{font-size:12px;font-weight:600}.lesson-info .l-desc{font-size:10px;color:var(--mt)}
 
.corner-btn{position:fixed;top:14px;right:14px;z-index:50}
 
@media(max-width:768px){
  .side{position:fixed;right:0;top:0;bottom:0;z-index:100;transform:translateX(100%);background:var(--bg)!important;box-shadow:-4px 0 24px rgba(0,0,0,.5)}.side.open{transform:translateX(0)}
  .mob-toggle{display:flex!important}.mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}.mob-overlay.open{display:block}
  .dash-stats{grid-template-columns:repeat(2,1fr)}.mode-cards{grid-template-columns:1fr}
  .h-badges{display:none!important}
}
@media(min-width:769px){.mob-toggle{display:none!important}.mob-overlay{display:none!important}}
</style>
</head>

<div id="app"></div>
<script>
// ═══════ DATA ═══════
const FRIENDS=[
  {id:"jake",name:"Jake",emoji:"😎",color:"#ef6461",desc:"O zoeiro, fala cheio de gíria e meme",style:"Very casual bro language, uses lots of slang like 'bro','dude','lowkey','no cap','deadass','fire','bet','vibes'. Types fast, sometimes uses abbreviations like 'ngl','tbh','imo','brb','lmao'. Makes jokes. Never formal."},

];
const TEACHER={name:"Mr. James",emoji:"👨‍🏫",color:"#3b82f6",desc:"Professor paciente e didático"};
const LESSONS=[
  {id:1,title:"Present Simple & Continuous",desc:"Quando usar cada um",topic:"present simple vs present continuous, with real examples and common mistakes Brazilians make"},
  {id:2,title:"Past Simple vs Present Perfect",desc:"A diferença que confunde todo brasileiro",topic:"past simple vs present perfect, focusing on 'already','yet','just','ever','never' and how Brazilians tend to misuse them"},
  {id:3,title:"Phrasal Verbs do Dia a Dia",desc:"Os 20 mais usados",topic:"the 20 most common phrasal verbs in everyday American English with examples: look up, give up, come up with, figure out, etc."},
  {id:4,title:"Preposições que Confundem",desc:"In, on, at, for, to, about",topic:"prepositions that are hardest for Portuguese speakers: in/on/at for time and place, for/to, about/on"},
  {id:5,title:"Conditionals na Prática",desc:"If I was vs If I were",topic:"conditionals (zero, first, second, third) with real conversational examples, including the common 'if I was' vs 'if I were' debate"},
  {id:6,title:"Modal Verbs",desc:"Can, could, should, would, might",topic:"modal verbs in everyday conversation: can/could for requests, should for advice, would for hypotheticals, might for possibility"},
  {id:7,title:"Artigos: A, An, The",desc:"Quando usar e quando NÃO usar",topic:"definite and indefinite articles, zero article cases, common mistakes Portuguese speakers make (they tend to overuse 'the')"},
  {id:8,title:"Reported Speech",desc:"'He said that...'",topic:"reported/indirect speech in casual conversation, not just grammar rules but how people actually report what others said"},
];
const FRIEND_SCENARIOS=[
  {id:"hangout",name:"Rolê casual",icon:"🍕",prompt:"You're all hanging out at someone's apartment, watching TV, eating pizza, talking about random stuff"},
  {id:"gaming",name:"Noite de game",icon:"🎮",prompt:"You're all playing video games online together, reacting to gameplay, trash talking, having fun"},
  {id:"bar",name:"Happy hour",icon:"🍺",prompt:"You're at a bar/restaurant after work, talking about life, work, relationships, weekend plans"},
  {id:"roadtrip",name:"Road trip",icon:"🚗",prompt:"You're on a road trip together, talking about music, stops, food, telling stories"},
  {id:"gossip",name:"Fofoca",icon:"👀",prompt:"You're gossiping about friends, celebrities, drama, sharing hot takes and opinions"},

async function sendMsg(){
  if(!S.input.trim()||S.loading)return;
  const txt=S.input.trim();
  const msgs=[...S.messages,{role:"user",content:txt}];
  set({messages:msgs,input:"",loading:true});
  checkStreak();S.totalMessages++;
 
  const sysP=S.mode==="teacher"?teacherPrompt():S.mode==="friends"?friendsPrompt():freePrompt();
 
  try{
    const h=msgs.slice(-14).map(m=>({role:m.role,content:m.content}));
    const full=await callAPI(h,sysP);
    let chat=full,data=null;
    if(full.includes("---DATA---")){const p=full.split("---DATA---");chat=p[0].trim();try{const m=p[1].match(/\{[\s\S]*\}/);if(m)data=JSON.parse(m[0])}catch(e){}}
 
    // Parse friend messages
    let parsedMsgs=[];
    if(S.mode==="friends"&&chat){
      const lines=chat.split("\n").filter(l=>l.trim());
      let current=null;
      for(const line of lines){
        const jm=line.match(/^😎\s*Jake[:\s](.+)/i);const mm=line.match(/^💅\s*Mia[:\s](.+)/i);const tm=line.match(/^🎮\s*Tyler[:\s](.+)/i);
        if(jm)parsedMsgs.push({friend:"jake",text:jm[1].trim()});
        else if(mm)parsedMsgs.push({friend:"mia",text:mm[1].trim()});
        else if(tm)parsedMsgs.push({friend:"tyler",text:tm[1].trim()});
        else if(parsedMsgs.length)parsedMsgs[parsedMsgs.length-1].text+=" "+line.trim();
      }
      if(!parsedMsgs.length)parsedMsgs=[{friend:"jake",text:chat}];
    }
 
    const u={messages:[...msgs,{role:"assistant",content:chat,parsed:parsedMsgs}],loading:false};
 
    if(data){
      const nf=[];
      (data.corrections||[]).forEach(c=>nf.push({type:"correction",text:`"${c.original}" → "${c.corrected}"`,detail:c.explanation}));
      (data.positive||[]).forEach(p=>nf.push({type:"positive",text:p}));
      if(data.culturalNote)nf.push({type:"culture",text:"🇺🇸 "+data.culturalNote});
      if(nf.length)u.feedback=[...nf,...S.feedback].slice(0,50);
 
      S.totalVocab+=(data.vocabNew?.length||0);
      if(data.suggestedLevel!==undefined&&data.suggestedLevel!==S.level)u.level=data.suggestedLevel;
 
      // Add slang to dictionary
      if(data.slangNew?.length){
        const newSlang=data.slangNew.filter(s=>s.word&&!S.slangDict.find(x=>x.word.toLowerCase()===s.word.toLowerCase()));
        if(newSlang.length)S.slangDict=[...newSlang,...S.slangDict].slice(0,100);
      }
    }
    if(S.mode==="friends")S.friendChats++;
    addXp(S.mode==="teacher"?15:S.mode==="friends"?12:10);
    checkAch();set(u);
  }catch(err){set({messages:[...msgs,{role:"assistant",content:`Erro: ${err.message} 🔄`}],loading:false})}
  setTimeout(()=>{document.getElementById("chat-end")?.scrollIntoView({behavior:"smooth"});document.getElementById("msg-input")?.focus()},50);
}

        }
        if(S.mode==="teacher"){
          return`<div class="msg-row bot"><div class="msg-avatar" style="border-color:${TEACHER.color}">${TEACHER.emoji}</div><div class="msg-col"><div class="msg-name" style="color:${TEACHER.color}">${TEACHER.name}</div><div class="msg-bbl bbl-teacher">${renderBotMessage(m)}</div><div class="msg-acts"><button class="tts-btn" data-tts="${i}">🔊</button></div></div></div>`;
        }
        return`<div class="msg-row bot"><div class="msg-col"><div class="msg-bbl">${renderWords(m.content)}</div><div class="msg-acts"><button class="tts-btn" data-tts="${i}">🔊</button></div></div></div>`;
      }).join("")}
      ${S.loading?`<div class="msg-row bot"><div class="typing-ind"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div></div>`:""}
      <div id="chat-end"></div>
    </div>
    ${S.translatingWord?`<div class="trans-bar">"${esc(S.translatingWord)}" → <strong>${esc(S.translationResult)}</strong></div>`:""}
    <div class="input-area"><div class="input-wrap"><input id="msg-input" placeholder="${S.mode==="friends"?"Type something...":"Write in English..."}" value="${esc(S.input)}"><button class="send-btn" id="send-btn" ${S.loading||!S.input.trim()?"disabled":""}>➤</button></div></div>
  </div>
  <div class="side ${S.mobilePanel?"open":""}">
    <div class="tab-bar">
      ${(S.mode==="friends"?[["feedback","💡"],["slang","🔥"],["culture","🇺🇸"]]:S.mode==="teacher"?[["feedback","💡"],["lessons","📖"],["slang","🔥"],["culture","🇺🇸"]]:[["feedback","💡"],["slang","🔥"]]).map(([t,ic])=>`<button class="tab ${S.sideTab===t?"active":""}" data-tab="${t}">${ic} ${t==="feedback"?"Feedback":t==="slang"?"Gírias":t==="culture"?"Cultural":t==="lessons"?"Aulas":t}</button>`).join("")}
    </div>
    <div class="side-c">${renderSide()}</div>
  </div>
</div>`;
 
// Events
document.getElementById("mob-ov")?.addEventListener("click",()=>set({mobilePanel:false}));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>set({sideTab:b.dataset.tab})));
document.getElementById("sc-sel")?.addEventListener("change",e=>set({friendScenario:e.target.value}));
document.getElementById("lesson-sel")?.addEventListener("change",e=>{const v=e.target.value;S.currentLesson=v?+v:null;render()});
const mi=document.getElementById("msg-input");if(mi){mi.addEventListener("input",e=>{S.input=e.target.value});mi.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey)sendMsg()})}
document.getElementById("send-btn")?.addEventListener("click",sendMsg);
document.querySelectorAll("[data-tts]").forEach(b=>b.addEventListener("click",()=>speak(S.messages[+b.dataset.tts].content)));
document.querySelectorAll("[data-tts-text]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.ttsText)));
setTimeout(()=>{document.getElementById("chat-end")?.scrollIntoView({behavior:"smooth"});mi?.focus()},30);
}
 
function renderSide(){
  if(S.sideTab==="feedback"){
    if(!S.feedback.length)return`<div class="empty"><div class="icon">💡</div><p>Converse e o feedback aparecerá aqui!</p></div>`;
    return S.feedback.map(f=>`<div class="fb ${f.type}"><div class="fb-text">${f.type==="positive"?"✅ ":f.type==="culture"?"":"📝 "}${esc(f.text)}</div>${f.detail?`<div class="fb-detail">${esc(f.detail)}</div>`:""}</div>`).join("")}
 
  if(S.sideTab==="slang"){
    if(!S.slangDict.length)return`<div class="empty"><div class="icon">🔥</div><p>${S.mode==="friends"?"Converse com o grupo e as gírias aparecerão aqui!":"Gírias que você aprender aparecerão aqui."}</p></div>`;
    return`<div style="font-size:11px;color:var(--mt);margin-bottom:10px">${S.slangDict.length} gírias aprendidas</div>`+S.slangDict.map(s=>`<div class="slang-item"><div style="display:flex;justify-content:space-between;align-items:center"><div class="slang-word">${esc(s.word)}</div><button class="tts-btn" onclick="speak('${esc(s.example||s.word)}')" style="opacity:.6">🔊</button></div><div class="slang-def">${esc(s.meaning)}</div>${s.example?`<div class="slang-ex">"${esc(s.example)}"</div>`:""}<div class="slang-formal">📗 Formal: ${esc(s.formal||"—")}</div></div>`).join("")}
 
  if(S.sideTab==="culture"){
    const notes=S.feedback.filter(f=>f.type==="culture");
    if(!notes.length)return`<div class="empty"><div class="icon">🇺🇸</div><p>Notas culturais sobre como americanos realmente falam aparecerão aqui conforme você conversa.</p></div>`;
    return notes.map(n=>`<div class="fb culture"><div class="fb-text">${esc(n.text)}</div></div>`).join("")}
 
  if(S.sideTab==="lessons"){
    return LESSONS.map(l=>`<div class="lesson-card" data-sl="${l.id}"><div class="lesson-num ${S.lessonsCompleted.includes(l.id)?'completed':''}">${S.lessonsCompleted.includes(l.id)?'✓':l.id}</div><div class="lesson-info"><div class="l-title">${l.title}</div><div class="l-desc">${l.desc}</div></div></div>`).join("");
  }
  return""}
 
window.toggleTheme=toggleTheme;window.set=set;window.goToDash=goToDash;window.translateWord=translateWord;window.speak=speak;window.S=S;
render();
</script>
</body>
</html>
