<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LinguaFlow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─── Palette ─── */
:root{
  --bg:#F7F7F8;--bg2:#FFFFFF;--bg3:#F0F0F2;
  --tx:#1A1A2E;--tx2:#4A4A68;--mt:#9CA3B0;
  --bd:#E8E8ED;--bd2:#D1D1D9;
  --ac:#4F46E5;--ac2:#4338CA;--acl:rgba(79,70,229,.06);--acl2:rgba(79,70,229,.1);
  --pos:#059669;--posl:rgba(5,150,105,.06);
  --warn:#D97706;--warnl:rgba(217,119,6,.06);
  --err:#DC2626;--errl:rgba(220,38,38,.06);
  --xp:#D97706;--streak:#DC2626;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
  --shadow-lg:0 4px 24px rgba(0,0,0,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --r:16px;--rs:12px;--rx:8px;
}
[data-theme="dark"]{
  --bg:#111119;--bg2:#1A1A26;--bg3:#222232;
  --tx:#E8E8F0;--tx2:#A0A0B8;--mt:#606078;
  --bd:#2A2A3A;--bd2:#3A3A4A;
  --acl:rgba(99,102,241,.1);--acl2:rgba(99,102,241,.16);
  --posl:rgba(16,185,129,.1);--warnl:rgba(245,158,11,.1);--errl:rgba(239,68,68,.1);
  --shadow:0 1px 3px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.15);
  --shadow-lg:0 4px 24px rgba(0,0,0,.3);--shadow-sm:0 1px 2px rgba(0,0,0,.15);
}

body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6}
body.lock{overflow:hidden}
::selection{background:var(--acl2);color:var(--ac)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}::-webkit-scrollbar-thumb:hover{background:var(--bd2)}

/* ─── Animations ─── */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes xpPop{0%{transform:scale(0) translateX(-50%);opacity:0}60%{transform:scale(1.15) translateX(-50%)}100%{transform:scale(1) translateX(-50%);opacity:1}}
@keyframes dotBounce1{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes dotBounce2{0%,80%,100%{transform:scale(0)}50%{transform:scale(1)}}
@keyframes dotBounce3{0%,80%,100%{transform:scale(0)}60%{transform:scale(1)}}
.ani{animation:up .5s cubic-bezier(.16,1,.3,1) both}

/* ─── Components ─── */
.btn{padding:10px 20px;border:none;border-radius:var(--rx);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s ease;display:inline-flex;align-items:center;gap:6px;letter-spacing:-.01em}
.btn-p{background:var(--ac);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.2)}.btn-p:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.25)}
.btn-g{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--shadow-sm)}.btn-g:hover{border-color:var(--bd2);box-shadow:var(--shadow)}
.btn-s{padding:7px 14px;font-size:12px}
.btn-i{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--rx);background:var(--bg2);border:1px solid var(--bd);cursor:pointer;color:var(--tx2);font-size:15px;transition:all .2s;box-shadow:var(--shadow-sm)}.btn-i:hover{border-color:var(--bd2);box-shadow:var(--shadow);color:var(--tx)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:-.01em}
.badge-xp{background:var(--warnl);color:var(--warn)}.badge-streak{background:var(--errl);color:var(--err)}
.input{padding:11px 14px;border-radius:var(--rx);border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:14px;font-family:inherit;outline:none;transition:all .2s;width:100%;box-shadow:var(--shadow-sm)}.input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:all .25s}
.card:hover{box-shadow:var(--shadow-lg)}
.tab-bar{display:flex;gap:2px;padding:6px;background:var(--bg3);border-radius:var(--rs);margin:0}
.tab{flex:1;padding:8px 4px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;border-radius:var(--rx);color:var(--mt);transition:all .2s}.tab.active{background:var(--bg2);color:var(--tx);box-shadow:var(--shadow-sm)}
.prog-track{background:var(--bg3);border-radius:99px;overflow:hidden;height:6px}.prog-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1)}

/* ─── Avatars ─── */
.avatar{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff;letter-spacing:-.02em;position:relative;overflow:hidden}
.avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);border-radius:inherit}
.av-jake{background:linear-gradient(135deg,#EF4444,#F97316)}.av-mia{background:linear-gradient(135deg,#EC4899,#A855F7)}
.av-tyler{background:linear-gradient(135deg,#10B981,#06B6D4)}.av-teacher{background:linear-gradient(135deg,#3B82F6,#6366F1)}
.av-sm{width:28px;height:28px;border-radius:8px;font-size:11px}

/* ─── Setup ─── */
.setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.setup-box{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:40px 32px;max-width:420px;width:100%;box-shadow:var(--shadow-lg)}
.setup-box h1{font-family:'Newsreader',serif;font-size:28px;text-align:center;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.setup-box .sub{text-align:center;color:var(--mt);font-size:13px;margin-bottom:28px}
.setup-box label{font-size:11px;color:var(--mt);display:block;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:12px;color:var(--mt);margin-top:8px;line-height:1.6}.hint a{color:var(--ac);text-decoration:none;font-weight:500}
.err-msg{color:var(--err);font-size:12px;margin-top:6px}

/* ─── Dashboard ─── */
.dash{min-height:100vh;background:var(--bg);padding:24px 20px 80px}
.dash-c{max-width:780px;margin:0 auto}
.dash-hi{font-family:'Newsreader',serif;font-size:32px;font-weight:600;letter-spacing:-.03em;margin-bottom:4px}
.dash-sub{color:var(--mt);font-size:14px;margin-bottom:20px}
.streak-card{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border:1px solid #FCD34D;border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:20px;color:#92400E}
[data-theme="dark"] .streak-card{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(245,158,11,.08));border-color:rgba(251,191,36,.2);color:#FCD34D}
.streak-num{font-size:36px;font-weight:800;line-height:1}.streak-label{font-size:13px;font-weight:500}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:2px}.stat-lbl{font-size:11px;color:var(--mt);font-weight:500;text-transform:uppercase;letter-spacing:.04em}

/* Mode Cards */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.mc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:24px 20px;cursor:pointer;transition:all .3s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--bd2)}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.mc-teacher::before{background:linear-gradient(90deg,#3B82F6,#6366F1)}
.mc-friends::before{background:linear-gradient(90deg,#EF4444,#F97316)}
.mc-watch::before{background:linear-gradient(90deg,#EC4899,#A855F7)}
.mc-free::before{background:linear-gradient(90deg,#10B981,#06B6D4)}
.mc-icon{margin-bottom:12px}
.mc-title{font-size:16px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.mc-desc{font-size:12px;color:var(--mt);line-height:1.5;margin-bottom:10px}
.mc-tags{display:flex;gap:4px;flex-wrap:wrap}
.mc-tag{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:500;background:var(--bg3);color:var(--tx2)}
.mc-badge{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:99px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--acl);color:var(--ac)}

/* Suggested Videos */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:28px}
.vid-card{border-radius:var(--rs);overflow:hidden;border:1px solid var(--bd);cursor:pointer;transition:all .25s;background:var(--bg2);box-shadow:var(--shadow-sm)}
.vid-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.vid-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vid-info{padding:10px 12px}
.vid-title{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.vid-cat{font-size:10px;color:var(--mt);font-weight:500}

/* Lesson Cards */
.lesson-list{display:flex;flex-direction:column;gap:6px;margin-bottom:28px}
.lesson-c{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--bd);cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.lesson-c:hover{box-shadow:var(--shadow);border-color:var(--bd2)}
.lesson-n{width:28px;height:28px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2);flex-shrink:0}.lesson-n.done{background:var(--pos);color:#fff}
.lesson-t{font-size:13px;font-weight:600;letter-spacing:-.01em}.lesson-d{font-size:11px;color:var(--mt)}

/* Achievements */
.ach-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px;-webkit-overflow-scrolling:touch}
.ach{flex-shrink:0;width:72px;text-align:center;padding:12px 6px;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--bd);font-size:9px;color:var(--mt);line-height:1.3;box-shadow:var(--shadow-sm);transition:all .2s}
.ach .ach-icon{font-size:22px;display:block;margin-bottom:4px;filter:grayscale(1);opacity:.4;transition:all .3s}
.ach.on{border-color:var(--warn);color:var(--tx)}.ach.on .ach-icon{filter:none;opacity:1;animation:float 3s ease-in-out infinite}

/* ─── Chat Layout ─── */
.app{display:flex;height:100vh;width:100%;background:var(--bg)}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.c-header{padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);flex-shrink:0}
.h-left{display:flex;align-items:center;gap:12px}
.h-title{font-weight:700;font-size:15px;letter-spacing:-.02em}.h-sub{font-size:11px;color:var(--mt);font-weight:500}
.h-right{display:flex;align-items:center;gap:8px}
.sel{padding:7px 10px;border-radius:var(--rx);border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:12px;font-family:inherit;cursor:pointer;outline:none;box-shadow:var(--shadow-sm)}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg-row{display:flex;gap:10px;animation:up .4s cubic-bezier(.16,1,.3,1) both}
.msg-row.user{justify-content:flex-end}
.msg-col{max-width:72%;display:flex;flex-direction:column;gap:3px}
.msg-name{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding-left:2px}
.msg-bbl{padding:12px 16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg-row.user .msg-bbl{background:var(--ac);color:#fff;border-radius:20px 20px 4px 20px;box-shadow:0 2px 8px rgba(79,70,229,.15)}
.msg-row:not(.user) .msg-bbl{background:var(--bg2);border:1px solid var(--bd);border-radius:20px 20px 20px 4px;box-shadow:var(--shadow-sm)}
.bbl-jake{border-color:rgba(239,68,68,.15)!important;background:linear-gradient(135deg,rgba(239,68,68,.03),var(--bg2))!important}
.bbl-mia{border-color:rgba(236,72,153,.15)!important;background:linear-gradient(135deg,rgba(236,72,153,.03),var(--bg2))!important}
.bbl-tyler{border-color:rgba(16,185,129,.15)!important;background:linear-gradient(135deg,rgba(16,185,129,.03),var(--bg2))!important}
.bbl-teacher{border-color:rgba(59,130,246,.15)!important;background:linear-gradient(135deg,rgba(59,130,246,.03),var(--bg2))!important}
.msg-acts{display:flex;gap:4px;padding-left:2px}
.tts-btn{background:none;border:none;cursor:pointer;font-size:13px;opacity:.3;transition:all .2s;padding:2px;border-radius:4px}.tts-btn:hover{opacity:.8;background:var(--bg3)}.tts-btn.playing{opacity:1;animation:pulse 1s infinite}
.word-cl{cursor:pointer;transition:all .15s;border-radius:2px;padding:0 1px}.word-cl:hover{background:var(--acl2);color:var(--ac)}

/* Whiteboard & Culture */
.whiteboard{margin:10px 0;padding:16px;border-radius:var(--rs);background:var(--bg3);border:1px dashed var(--bd2);font-size:13px;line-height:1.8}
.wb-title{font-size:10px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.wb-formal{color:var(--warn);font-weight:600}.wb-real{color:var(--pos);font-weight:600}
.culture-note{margin:8px 0;padding:12px 14px;border-radius:var(--rs);background:var(--warnl);font-size:12px;line-height:1.6}
.cn-title{font-size:10px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

/* Typing */
.typing-dots{display:inline-flex;gap:4px;padding:14px 20px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px 20px 20px 4px;box-shadow:var(--shadow-sm)}
.t-dot{width:8px;height:8px;border-radius:50%;background:var(--bd2)}
.t-dot:nth-child(1){animation:dotBounce1 1.4s infinite ease-in-out}.t-dot:nth-child(2){animation:dotBounce2 1.4s infinite ease-in-out}.t-dot:nth-child(3){animation:dotBounce3 1.4s infinite ease-in-out}

/* XP Popup */
.xp-pop{position:fixed;top:24%;left:50%;transform:translateX(-50%);z-index:999;animation:xpPop .5s cubic-bezier(.16,1,.3,1);pointer-events:none}
.xp-inner{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px 32px;text-align:center;box-shadow:var(--shadow-lg)}.xp-val{font-size:32px;font-weight:800;color:var(--warn);letter-spacing:-.03em}.xp-lbl{font-size:12px;color:var(--mt)}
.trans-bar{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);z-index:50;background:var(--tx);color:var(--bg);padding:8px 20px;border-radius:var(--rx);font-size:13px;animation:scaleIn .2s;box-shadow:var(--shadow-lg);font-weight:500}

/* Input */
.input-area{padding:12px 20px;border-top:1px solid var(--bd);background:var(--bg2)}
.input-wrap{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:var(--r);padding:4px 4px 4px 16px;border:1px solid var(--bd);transition:all .2s;box-shadow:var(--shadow-sm)}.input-wrap:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
.input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:14px;padding:10px 0;font-family:inherit}
.send-btn{background:var(--ac);border:none;border-radius:var(--rs);padding:10px 20px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(79,70,229,.2)}.send-btn:hover{background:var(--ac2)}.send-btn:disabled{background:var(--bg3);color:var(--mt);box-shadow:none;cursor:default}

/* ─── Side Panel ─── */
.side{width:340px;border-left:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg);flex-shrink:0;overflow:hidden}
.side-top{padding:12px;border-bottom:1px solid var(--bd)}
.side-c{flex:1;overflow-y:auto;padding:16px}

/* Feedback */
.fb{padding:12px 14px;border-radius:var(--rs);margin-bottom:8px;animation:up .3s both;border-left:3px solid;background:var(--bg2);box-shadow:var(--shadow-sm)}
.fb.positive{border-left-color:var(--pos);background:var(--posl)}.fb.correction{border-left-color:var(--warn);background:var(--warnl)}.fb.culture{border-left-color:#3B82F6;background:rgba(59,130,246,.04)}
.fb-tx{font-size:13px;font-weight:500;line-height:1.5}.fb-dt{font-size:12px;color:var(--mt);line-height:1.5;margin-top:4px}.fb-rule{margin-top:6px;padding:8px 10px;border-radius:var(--rx);background:var(--bg3);font-size:11px;color:var(--tx2);line-height:1.5;font-weight:500}

/* Slang */
.slang{padding:14px;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--bd);margin-bottom:8px;box-shadow:var(--shadow-sm);transition:all .2s;animation:up .3s both}
.slang:hover{box-shadow:var(--shadow)}
.slang-word{font-size:16px;font-weight:700;color:var(--ac);letter-spacing:-.02em}
.slang-def{font-size:13px;color:var(--tx2);margin-top:2px}.slang-ex{font-size:12px;color:var(--mt);margin-top:4px;font-style:italic;padding-left:10px;border-left:2px solid var(--bd)}
.slang-formal{font-size:11px;color:var(--warn);margin-top:4px;font-weight:500}

/* Watch */
.watch-top{flex-shrink:0;border-bottom:1px solid var(--bd);background:#000}
.watch-top iframe{width:100%;aspect-ratio:16/9;max-height:34vh;display:block;border:none}
.watch-ph{aspect-ratio:16/9;max-height:34vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg3);gap:10px;padding:20px;color:var(--mt);font-size:13px;text-align:center}
.watch-url{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.watch-toggle{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--bd);background:var(--bg2);align-items:center}
.wt-btn{padding:6px 14px;border-radius:var(--rx);border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;color:var(--mt);transition:all .2s;box-shadow:var(--shadow-sm)}.wt-btn.active{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 1px 3px rgba(79,70,229,.2)}

.empty{text-align:center;padding:40px 20px;color:var(--mt)}.empty p{font-size:13px;line-height:1.6;margin-top:8px}
.section-title{font-size:13px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.corner-btn{position:fixed;top:16px;right:16px;z-index:50}

@media(max-width:768px){
  .side{position:fixed;right:0;top:0;bottom:0;z-index:100;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);background:var(--bg)!important;box-shadow:var(--shadow-lg)}.side.open{transform:translateX(0)}
  .mob-t{display:flex!important}.mob-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none;backdrop-filter:blur(2px)}.mob-ov.open{display:block}
  .stats-row{grid-template-columns:repeat(2,1fr)}.modes{grid-template-columns:1fr}.vid-grid{grid-template-columns:1fr 1fr}
  .h-badges{display:none!important}
}

function renderSide(){
if(S.sideTab==="feedback"){if(!S.feedback.length)return`<div class="empty"><svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke="var(--mt)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><p>Converse e o feedback aparecerá aqui</p></div>`;
return S.feedback.map(f=>`<div class="fb ${f.type}"><div class="fb-tx">${f.type==="positive"?"✓ ":f.type==="culture"?"🇺🇸 ":"→ "}${esc(f.text)}</div>${f.detail?`<div class="fb-dt">${esc(f.detail)}</div>`:""}</div>`).join("")}
if(S.sideTab==="slang"){if(!S.slangDict.length)return`<div class="empty"><p>Gírias que você aprender aparecerão aqui automaticamente.</p></div>`;
return`<div style="font-size:12px;color:var(--mt);margin-bottom:12px;font-weight:500">${S.slangDict.length} gírias aprendidas</div>`+S.slangDict.map(s=>`<div class="slang"><div style="display:flex;justify-content:space-between;align-items:center"><div class="slang-word">${esc(s.word)}</div><button class="tts-btn" onclick="speak('${esc(s.example||s.word)}')" style="opacity:.5">🔊</button></div><div class="slang-def">${esc(s.meaning)}</div>${s.example?`<div class="slang-ex">"${esc(s.example)}"</div>`:""}<div class="slang-formal">📗 ${esc(s.formal||"—")}</div></div>`).join("")}
if(S.sideTab==="culture"){const n=S.feedback.filter(f=>f.type==="culture");if(!n.length)return`<div class="empty"><p>Notas culturais aparecerão aqui conforme você conversa.</p></div>`;return n.map(x=>`<div class="fb culture"><div class="fb-tx">🇺🇸 ${esc(x.text)}</div></div>`).join("")}
return""}

function $(id){return document.getElementById(id)}
window.toggleTheme=toggleTheme;window.set=set;window.goToDash=goToDash;window.translateWord=translateWord;window.speak=speak;window.loadVideo=loadVideo;window.S=S;
render();
</script>
